[package]
name = "scratchpad-store"
version = "0.2.0"
edition = "2021"
description = "File-backed pad store shared by the Tauri app. Same layout as the Swift PadStore: pads/<id>.json and assets/."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
