name: Apple

on:
  push:
    branches: [master]
    paths: ["apple/**", "shared/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", "shared/**", ".github/workflows/apple.yml"]

jobs:
  core:
    name: ScratchpadCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - run: swift test
        working-directory: apple

  app:
    name: Build app (${{ matrix.destination }})
    runs-on: macos-15
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=macOS"
          - destination: "generic/platform=iOS Simulator"
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apple
      - run: |
          xcodebuild build -project Scratchpad.xcodeproj -scheme Scratchpad \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -skipPackagePluginValidation | xcpretty || exit ${PIPESTATUS[0]}
        working-directory: apple
