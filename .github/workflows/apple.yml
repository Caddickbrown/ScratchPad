name: Apple

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ["apple/**", "core/**", "shared/**", "kit/swift/**", ".github/workflows/apple.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ScratchpadCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - run: apple/scripts/build-core.sh --host-only
      - run: swift test
        working-directory: apple
      - run: swift run core-check check
        working-directory: apple
      - name: ⌘K commands-check
        run: sh apple/Tests/commands-check/run.sh

  app:
    name: Build app (${{ matrix.destination }})
    runs-on: macos-15
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - destination: "platform=macOS"
          - destination: "generic/platform=iOS"
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - run: brew install xcodegen
      # build-core.sh makes a universal Mac slice since 6e19786 (18 Nov): it needs x86_64-apple-darwin too.
      - run: rustup target add aarch64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
      - run: apple/scripts/build-core.sh
      - run: xcodegen generate
        working-directory: apple
      - run: |
          xcodebuild build -project Scratchpad.xcodeproj -scheme Scratchpad \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -skipPackagePluginValidation | xcpretty || exit ${PIPESTATUS[0]}
        working-directory: apple
