name: Linux

on:
  push:
    branches: [master]
    paths: ["linux/**", "shared/**", ".github/workflows/linux.yml"]
  pull_request:
    paths: ["linux/**", "shared/**", ".github/workflows/linux.yml"]

jobs:
  build:
    name: Test and bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            linux/src-tauri
            linux/store
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: linux
      - run: npm test
        working-directory: linux
      - run: cargo test
        working-directory: linux/store
      - run: npm run tauri build
        working-directory: linux
      - uses: actions/upload-artifact@v4
        with:
          name: scratchpad-linux
          path: |
            linux/src-tauri/target/release/bundle/deb/*.deb
            linux/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
