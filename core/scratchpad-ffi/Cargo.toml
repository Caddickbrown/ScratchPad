[package]
name = "scratchpad-ffi"
description = "UniFFI layer over scratchpad-core, for the Swift shell."
version = "0.3.0"
edition = "2021"
publish = false

[lib]
name = "scratchpad_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]

[dependencies]
scratchpad-core = { path = "../scratchpad-core" }
uniffi = "=0.32.2"
serde_json = "1"
