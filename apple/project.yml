# XcodeGen spec. Run `xcodegen generate` in apple/ to produce Scratchpad.xcodeproj.
name: Scratchpad
options:
  bundleIdPrefix: com.caddickbrown
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  # The rules are in core/, and the xcframework isn't committed.
  preGenCommand: >-
    test -d Frameworks/ScratchpadCoreFFI.xcframework ||
    { echo "error: no core. Run apple/scripts/build-core.sh first, then xcodegen." >&2; exit 1; }
packages:
  ScratchpadCore:
    path: .
targets:
  Scratchpad:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/ScratchpadApp
      # The ⌘K menu's rules and keys, shared between the apps.
      - path: ../kit/swift/CommandPalette.swift
      # Esc and ⌘. on every field and the window.
      - path: ../kit/swift/FieldEscape.swift
      - path: Resources
    dependencies:
      - package: ScratchpadCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Scratchpad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHumanReadableCopyright: ""
        # Sheets live in the iCloud container under Documents/Scratchpad; declaring the container public
        # is what puts them in Files › iCloud Drive › Scratchpad (and Finder on the Mac).
        NSUbiquitousContainers:
          iCloud.com.caddickbrown.scratchpad:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Scratchpad
            NSUbiquitousContainerSupportedFolderLevels: Any
        # Declaring the external-display scene stops iOS mirroring the app onto a monitor and gives
        # Scratchpad its own window there (monitor mode, Sources/ScratchpadApp/MonitorDisplay.swift).
        # The application role is left out: SwiftUI's WindowGroup supplies it. Multiple scenes must
        # be on for a second scene at all; on iPad that also allows several Scratchpad windows.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).MonitorSceneDelegate
    entitlements:
      path: Resources/Scratchpad.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.caddickbrown.scratchpad]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.caddickbrown.scratchpad]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
